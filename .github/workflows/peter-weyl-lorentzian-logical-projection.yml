name: peter-weyl-lorentzian-logical-projection

on:
  push:
    branches:
      - research/pw-lorentzian-logical-projection
  pull_request:
    paths:
      - 'scripts/peter_weyl_lorentzian_logical_projection_gate.py'
      - 'scripts/peter_weyl_lorentzian_logical_projection_v2_gate.py'
      - 'scripts/peter_weyl_lorentzian_sine_ordered_triple_gate.py'
      - 'scripts/peter_weyl_lorentzian_ordered_triple_gate.py'
      - 'scripts/peter_weyl_covariant_K_composition_gate.py'
      - 'scripts/peter_weyl_covariant_composition_gate.py'
      - '.github/workflows/peter-weyl-lorentzian-logical-projection.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Syntax
        run: |
          python -m py_compile scripts/peter_weyl_lorentzian_logical_projection_gate.py
          python -m py_compile scripts/peter_weyl_lorentzian_logical_projection_v2_gate.py
      - name: Full epsilon-oriented raw Lorentzian logical projection
        run: |
          python scripts/peter_weyl_lorentzian_logical_projection_v2_gate.py \
            --node 0 \
            --output verification_results/PETER_WEYL_LORENTZIAN_LOGICAL_PROJECTION.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peter-weyl-lorentzian-logical-projection-evidence
          path: verification_results/PETER_WEYL_LORENTZIAN_LOGICAL_PROJECTION.json
